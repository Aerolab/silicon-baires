<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Silicon Baires</title>
    <meta name="description" content="Una ciudad entera hecha con código en Blender, al estilo de la secuencia de títulos de Silicon Valley, corriendo a 60 fps en WebGL. Dale play, o movés la cámara vos." />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="author" content="Aerolab" />
    <meta name="theme-color" content="#0d0d0f" />

    <!-- The card is the whole first impression: on Twitter almost everyone sees
         this image and never the page. og.jpg is the hero frame cropped to
         1.91:1 with the title clear of every edge, because the crop a client
         applies is not the crop you chose. The URLs have to be absolute; the
         domain is filled in at build time, see the site-url plugin in
         vite.config.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Silicon Baires" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Silicon Baires" />
    <meta property="og:description" content="Buenos Aires como la secuencia de títulos de Silicon Valley: una ciudad entera generada por código en Blender, a 60 fps en el navegador. La cámara la movés vos." />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vista isométrica de una ciudad low poly con BUENOS AIRES construido en letras rojas sobre las torres, y logos de empresas en las fachadas." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Silicon Baires" />
    <meta name="twitter:description" content="Buenos Aires como la secuencia de títulos de Silicon Valley: una ciudad entera generada por código en Blender, a 60 fps en el navegador. La cámara la movés vos." />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <meta name="twitter:image:alt" content="Vista isométrica de una ciudad low poly con BUENOS AIRES construido en letras rojas sobre las torres." />

    <!-- 16px is the only size that matters, and it decided this twice. Cropped
         letters from the render were mush; an isometric block in the title's
         red sat on a dark square and vanished into a dark tab bar. The Obelisco
         on the title's red is a silhouette plus a colour, which is what a tab
         is actually found by. Its shaft is fatter than the real monument's: at
         16px the true proportion is a hairline and reads as an "i". -->
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0d0d0f; overflow: hidden;
             font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
             color: #e8e4dc; }
      canvas { display: block; }

      #hud { position: fixed; left: 16px; bottom: 16px; z-index: 10;
             display: flex; gap: 14px; align-items: center;
             background: rgba(12,12,14,.72); backdrop-filter: blur(8px);
             border: 1px solid rgba(255,255,255,.10); border-radius: 10px;
             padding: 9px 13px; user-select: none; }
      #hud button { color: inherit; cursor: pointer; display: grid;
                    place-items: center; width: 30px; height: 30px;
                    background: rgba(255,255,255,.08); border: 0;
                    border-radius: 8px; padding: 0;
                    transition: background .15s; }
      #hud button:hover { background: rgba(255,255,255,.18); }
      #hud button svg { width: 16px; height: 16px; display: block; }
      #scrub { width: 260px; accent-color: #d8352a; }
      /* Diagnostic, like #stats: the slider already says where the shot is,
         and a frame counter on a piece reads as a tool. ?stats=1 brings it. */
      #frame { min-width: 88px; opacity: .75; font-variant-numeric: tabular-nums;
               display: none; }
      #frame.on { display: inline; }
      /* Hidden unless ?stats=1: it is a diagnostic, not part of the piece. */
      #stats { position: fixed; right: 16px; bottom: 16px; z-index: 10;
               text-align: right; opacity: .45; line-height: 1.7;
               display: none; }
      #stats.on { display: block; }
      #load { position: fixed; inset: 0; display: grid; place-items: center;
              background: #0d0d0f; z-index: 20; transition: opacity .5s; }
      #load.gone { opacity: 0; pointer-events: none; }
      #load .box { display: flex; flex-direction: column; gap: 14px;
                   align-items: center; width: 240px; }
      #load span { opacity: .5; letter-spacing: .14em; text-transform: uppercase; }
      /* A bar and a percentage, not a spinner: the city is 8 MB, and what a
         person wants to know while waiting is how much is left. */
      #bar { width: 100%; height: 2px; background: rgba(255,255,255,.12);
             overflow: hidden; }
      #bar i { display: block; height: 100%; width: 0%; background: #d8352a;
               transition: width .25s ease-out; }
      #pct { opacity: .35; font-variant-numeric: tabular-nums; letter-spacing: .08em; }

      /* The page saying it failed, instead of being white. og.jpg is already
         downloaded on any visit that came from a shared link, and it is the
         only honest thing to show: this is what you were about to see. */
      #fail { position: fixed; inset: 0; z-index: 30; display: grid;
              place-items: center; background: #0d0d0f; padding: 24px;
              overflow-y: auto; }
      #fail[hidden] { display: none; }
      #fail .box { display: flex; flex-direction: column; gap: 16px;
                   max-width: 460px; text-align: left; }
      #fail img { width: 100%; border-radius: 8px; display: block;
                  border: 1px solid rgba(255,255,255,.10); }
      #fail h1 { font: inherit; font-size: 15px; letter-spacing: .04em; }
      #fail p { opacity: .6; line-height: 1.7; }
      #fail button { align-self: start; color: inherit; font: inherit;
                     cursor: pointer; background: #d8352a; border: 0;
                     border-radius: 8px; padding: 9px 16px; }
    </style>

    <!-- THE PAGE HAS TO BE ABLE TO SAY THAT IT FAILED, and it has to be able
         to say it before its own module has parsed, which is why this is
         inline and in the head rather than in src/.

         What it covers: a module that throws on load, a fetch that never
         arrives, a WebGL context that cannot be created or is later lost.
         What it CANNOT cover, and the reason src/tier.js exists: when Chromium
         kills the renderer process for memory, nothing on this page runs
         again. There is no handler for that, only a cheaper frame.

         Once main.js sets __cityRunning the screen stops being covered for a
         stray error: by then the city is up, and a bug in one corner is not a
         reason to hide it. A lost context is exempt, it passes force. -->
    <script>
      window.__cityFail = function (why, force) {
        if (window.__cityRunning && !force) return;
        if (window.__cityFailed) return;          // first cause, not the last
        window.__cityFailed = why;
        var load = document.getElementById("load");
        var el = document.getElementById("fail");
        if (load) load.classList.add("gone");
        if (!el) return;
        document.getElementById("failwhy").textContent = why;
        el.hidden = false;
      };
      addEventListener("error", function (e) {
        window.__cityFail("No se pudo cargar la ciudad: " + (e.message || "error"));
      });
      addEventListener("unhandledrejection", function (e) {
        window.__cityFail("No se pudo cargar la ciudad: " +
          ((e.reason && e.reason.message) || "no llegaron todos los archivos"));
      });
    </script>
  </head>
  <body>
    <div id="load">
      <div class="box">
        <span>cargando la ciudad</span>
        <div id="bar"><i></i></div>
        <span id="pct">0%</span>
      </div>
    </div>
    <div id="hud">
      <button id="play" title="Pausar (espacio)" aria-label="Pausar"></button>
      <input id="scrub" type="range" min="1" max="624" value="1" step="1" />
      <span id="frame">1 / 624</span>
      <button id="free" title="Cámara libre (F)" aria-label="Cámara libre"></button>
    </div>
    <div id="stats"></div>
    <div id="fail" hidden>
      <div class="box">
        <img src="./og.jpg" alt="Vista isométrica de una ciudad low poly con BUENOS AIRES construido en letras rojas sobre las torres." />
        <!-- Neutral on purpose: this covers both a city that never started and
             one that was running and got cut off. -->
        <h1>La ciudad no anda en este equipo</h1>
        <p id="failwhy"></p>
        <p>Es una ciudad entera en 3D corriendo en el navegador, y hay teléfonos
           que se quedan sin memoria de video antes de terminar de dibujarla.
           Desde una compu anda.</p>
        <button onclick="location.reload()">Reintentar</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
