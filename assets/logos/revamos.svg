  <!-- The full lockup: the saucer on the left, "Revamos" to the right of it.
       Two edits against the file as supplied, both because Blender's SVG
       importer reads less of the format than a browser does and fails silently
       at each:

         · `width`/`height` added. The source carried a `viewBox` alone, and the
           importer returns an EMPTY CURVE for that without raising.

         · `fill` inlined. The source is `fill="currentColor"` throughout, with
           the two colours coming from the page's CSS classes `text-white` and
           `text-turquoise`. The importer resolves neither `currentColor` nor a
           `<style>` block: it hands back BLACK, which is a real colour, so it
           beats the brand's `ink` and the mark goes up black without a word.

       The colours are the ones those two classes resolve to: the wordmark is
       white, the saucer is #00d9bd.

       ONE FILE, not the usual `_iso`/`_word` pair. Those exist here when a
       brand's symbol and name are mounted in different places; this one goes up
       whole, on the long wall of spot 75, so the split would be two files
       nothing reads. `logo(only_x=...)` takes a subset straight out of this one
       if a narrow wall ever needs the saucer alone. -->
